name: Test and build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/zephyrproject-rtos/ci:v0.26.12
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: insuBox

      - name: Initialize
        working-directory: insuBox
        run: |
          west init -l .
          west update -o=--depth=1 -n

      - name: Install dependencies
        run: |
          pip install --user -r zephyr/scripts/requirements.txt
          pip install --user -r bootloader/mcuboot/scripts/requirements.txt
          
      - name: Twister Tests
        working-directory: insuBox
        run: |
          west twister -T tests --integration --jobs 1

      - name: Build
        working-directory: insuBox
        run: |
          west build -b native_sim app

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            insuBox/twister-out/native_posix/lib/lib.*/build.log
            insuBox/twister-out/twister.log
          retention-days: 5

  # This step is here purely to check if the doc builds, deployment of the doc is done in generate_docs.yml
  generate-docs:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Europe/Amsterdam /etc/localtime
          apt-get update
          apt-get install -y doxygen graphviz plantuml git
          ln -fs /usr/share/plantuml/ /usr/share/java/

      - name: Generate Doxygen Documentation
        run: |
          doxygen ./doc/Doxyfile
          ls -alh ./doc/html

      - name: Upload Doxygen HTML
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: doc/html
          retention-days: 3

